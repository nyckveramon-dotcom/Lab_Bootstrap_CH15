<!--
============================================================
Página de INICIO · Sabores de la Plaza
Ejercicios 01, 02, 03, 07 y 08
============================================================
Sabores de la Plaza es un colectivo de puestos de una plaza de
mercado: fruteros, panadería, almuerzos, jugos naturales y café.
Quieren un sitio de tres páginas: index.html (esta), puestos.html
y contacto.html. Escribe tu HTML DEBAJO de este comentario.
Todo con Bootstrap: nada de JavaScript propio.

Ejercicio 01 · Bootstrap instalado (en las TRES páginas)
  - El esqueleto de siempre, con el <meta name="viewport">.
  - En el <head>: el CSS de Bootstrap 5 (cópialo de la documentación)
    y DESPUÉS tu <link href="styles.css" rel="stylesheet">.
  - Al final del <body>: el <script> de bootstrap.bundle.min.js.

Ejercicio 02 · Barra de navegación (idéntica en las TRES páginas)
  - Una navbar con navbar-expand-lg, la marca "Sabores de la Plaza"
    (clase navbar-brand) y el botón navbar-toggler para el celular.
  - El data-bs-target del botón apunta al id del div collapse.
  - Enlaces a index.html, puestos.html y contacto.html.

Ejercicio 03 · La bienvenida (solo en esta página)
  - Un banner (hero) con el único <h1> de esta página, una frase y un
    botón (clase btn) que lleve a puestos.html o a contacto.html.
  - Una fila con 3 o 4 bloques de presentación (fresco, local,
    hecho a mano…): uno debajo del otro en el celular y todos en
    una sola fila en el computador.
  - Un <footer> con los datos del colectivo.

Ejercicio 07 · El carrusel (aquí o en puestos.html)
  - El cliente quiere "fotos que pasen solas". Búscalo en
    Components → Carousel. Al menos 3 fotos, cada una con alt.
  - En plaza/img/ tienes 3 imágenes listas para usar.

Ejercicio 08 · La letra (en las TRES páginas)
  - El <link> de Google Fonts con tu fuente, en el <head>.
============================================================
-->

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INICIO · Sabores de la Plaza</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">

</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-shop"> Sabores de la Plaza </i>
      
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" aria-current="page" href="contacto.html">Pedidos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="puestos.html">Catálogo</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<header class="container py-5 text-center">
  <h1>Sabores que nacen de nuestra tierra</h1>

  <p class="lead">
    Traemos productos desde el campo para que puedas disfrutarlos en tu hogar
  </p>

  <a href="puestos.html" class="btn btn-primary">
    Conoce nuestros puestos
  </a>

  <a href="contacto.html" class="btn btn-outline-primary">
    Haz tu pedido
  </a>
</header>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
